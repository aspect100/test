<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💥 Surprise Boyfriend Day 💥</title>
  <!-- Font & basic styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2b1b3a 0%, #1a1124 100%);
      font-family: 'Quicksand', sans-serif;
      padding: 16px;
    }

    .card {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 240, 245, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 60px 60px 40px 40px;
      padding: 36px 32px 44px;
      box-shadow: 0 30px 45px -10px rgba(0, 0, 0, 0.7), 0 0 0 2px #ffb6c9 inset, 0 0 0 4px #ffd9e6 inset;
      transition: 0.3s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* sparkle overlay */
    .card::before {
      content: "✨💖✨💖✨";
      position: absolute;
      top: -10px;
      left: -10px;
      font-size: 48px;
      opacity: 0.1;
      white-space: nowrap;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .card::after {
      content: "💕💕💕";
      position: absolute;
      bottom: 10px;
      right: 0px;
      font-size: 64px;
      opacity: 0.08;
      transform: rotate(8deg);
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      background: #ff477e;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 2px;
      padding: 8px 24px;
      border-radius: 40px;
      box-shadow: 0 6px 0 #9f1f47;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 3.8rem;
      line-height: 1.1;
      color: #2d0f28;
      text-shadow: 6px 6px 0 #ffb0c8, 0 12px 20px rgba(255, 80, 120, 0.3);
      margin: 8px 0 4px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .subhead {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6b2a4a;
      background: rgba(255, 215, 225, 0.6);
      display: inline-block;
      padding: 6px 28px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      margin-bottom: 24px;
      border: 1px solid #ffb0c0;
    }

    .countdown-panel {
      background: rgba(40, 20, 40, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 80px;
      padding: 20px 16px;
      margin: 20px 0 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px 22px;
      border: 1px solid #ffb6d0;
      box-shadow: 0 12px 0 #3f1b32;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-number {
      font-family: 'Fredoka One', cursive;
      font-size: 3.4rem;
      line-height: 1;
      color: #ffeef4;
      text-shadow: 0 4px 0 #a1365a;
      letter-spacing: 2px;
    }

    .time-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #ffc1d4;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .divider-dots {
      color: #ffafc9;
      font-size: 2.4rem;
      font-weight: 300;
      display: none;
    }

    @media (min-width: 520px) {
      .divider-dots {
        display: inline;
      }
    }

    .message-box {
      background: #faeef3;
      border-radius: 50px;
      padding: 24px 28px;
      margin: 12px 0 22px;
      border: 2px dashed #ff7ca6;
      box-shadow: 0 6px 0 #b34b6b;
    }

    .message-box p {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2d1424;
      line-height: 1.5;
    }

    .message-box span {
      background: #ffd9e4;
      padding: 4px 14px;
      border-radius: 40px;
      display: inline-block;
      font-size: 1.5rem;
    }

    .btn-surprise {
      background: #ff3b6f;
      border: none;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      padding: 16px 34px;
      border-radius: 80px;
      box-shadow: 0 10px 0 #941f44, 0 10px 25px rgba(255, 40, 80, 0.5);
      cursor: pointer;
      transition: all 0.1s ease;
      letter-spacing: 2px;
      margin: 8px 0 8px;
      width: 100%;
      max-width: 360px;
      display: inline-block;
      border: 2px solid #ffaec9;
    }

    .btn-surprise:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #941f44;
    }

    .btn-surprise:hover {
      background: #ff1f5a;
      transform: scale(1.02);
    }

    .gift-reveal {
      margin-top: 24px;
      background: rgba(255, 235, 240, 0.5);
      border-radius: 50px;
      padding: 14px 20px;
      border: 1px solid #ff99b9;
      backdrop-filter: blur(2px);
      transition: 0.3s;
      font-size: 1.2rem;
      font-weight: 600;
      color: #401d30;
    }

    .gift-reveal i {
      font-style: normal;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .footer-note {
      margin-top: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6f3d56;
      background: rgba(255, 200, 215, 0.3);
      padding: 8px 16px;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(2px);
    }

    /* confetti / emoji burst */
    .confetti-emoji {
      font-size: 2rem;
      line-height: 1;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .card { padding: 24px 16px; }
      h1 { font-size: 2.8rem; }
      .time-number { font-size: 2.6rem; }
      .btn-surprise { font-size: 1.6rem; padding: 14px 20px; }
    }
  </style>
</head>
<body>

  <div class="card" id="surpriseCard">
    <!-- decorative floating elements (pure css) -->
    <div style="position: relative; z-index: 2;">

      <div class="badge">❤️‍🔥 TODAY IS THE DAY ❤️‍🔥</div>

      <h1>🎁 SURPRISE <br>BOYFRIEND DAY</h1>
      <div class="subhead">💘 for the most amazing guy 💘</div>

      <!-- COUNTDOWN TIMER -->
      <div class="countdown-panel" id="countdownPanel">
        <div class="time-block">
          <span class="time-number" id="days">00</span>
          <span class="time-label">Days</span>
        </div>
        <span class="divider-dots">:</span>
        <div class="time-block">
          <span class="time-number" id="hours">00</span>
          <span class="time-label">Hours</span>
        </div>
        <span class="divider-dots">:</span>
        <div class="time-block">
          <span class="time-number" id="minutes">00</span>
          <span class="time-label">Minutes</span>
        </div>
        <span class="divider-dots">:</span>
        <div class="time-block">
          <span class="time-number" id="seconds">00</span>
          <span class="time-label">Seconds</span>
        </div>
      </div>

      <!-- MESSAGE BOX -->
      <div class="message-box">
        <p>💬 <span id="dynamicMessage">You are my favorite surprise!</span> 💬</p>
      </div>

      <!-- SURPRISE BUTTON -->
      <button class="btn-surprise" id="surpriseBtn">✨ PUSH FOR SURPRISE ✨</button>

      <!-- REVEAL AREA (dynamic) -->
      <div class="gift-reveal" id="giftReveal">
        <i>💥 click the button above 💥</i>
      </div>

      <div class="footer-note">
        ⏳ counting down to forever with you 💞
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ----- ELEMENTS -----
      const daysSpan = document.getElementById('days');
      const hoursSpan = document.getElementById('hours');
      const minutesSpan = document.getElementById('minutes');
      const secondsSpan = document.getElementById('seconds');
      const surpriseBtn = document.getElementById('surpriseBtn');
      const giftReveal = document.getElementById('giftReveal');
      const dynamicMsg = document.getElementById('dynamicMessage');

      // ----- SET TARGET DATE (Surprise Boyfriend Day: next occurrence) -----
      // We'll set it to August 3rd (common "Boyfriend Day" in some regions)
      // but to make it fun: we target the upcoming August 3rd, or if today is after Aug 3, next year.
      const now = new Date();
      let targetYear = now.getFullYear();
      // Boyfriend Day: August 3
      const targetMonth = 7; // 0-indexed: August = 7
      const targetDay = 3;

      let targetDate = new Date(targetYear, targetMonth, targetDay, 23, 59, 59); // end of day

      // If already past August 3 this year, set to next year
      if (now > targetDate) {
        targetDate = new Date(targetYear + 1, targetMonth, targetDay, 23, 59, 59);
      }

      // ----- UPDATE COUNTDOWN -----
      function updateCountdown() {
        const current = new Date();
        let diff = targetDate - current;

        // if countdown is over (should not happen but safety)
        if (diff <= 0) {
          diff = 0;
          // optional: change message to "It's today!" 
          dynamicMsg.innerText = "🎉 IT'S SURPRISE DAY! 🎉";
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        daysSpan.textContent = String(days).padStart(2, '0');
        hoursSpan.textContent = String(hours).padStart(2, '0');
        minutesSpan.textContent = String(minutes).padStart(2, '0');
        secondsSpan.textContent = String(seconds).padStart(2, '0');
      }

      // initial call
      updateCountdown();
      // update every second
      const timerInterval = setInterval(updateCountdown, 1000);

      // ----- SURPRISE BUTTON INTERACTION -----
      const surpriseMessages = [
        "🥰 I love you more than pizza! 🍕",
        "💖 You are my sunshine on cloudy days ☀️",
        "🎮 Let's play games and cuddle 🐱",
        "🍫 You're sweeter than chocolate 🍬",
        "🚀 You make my heart blast off! 💫",
        "💝 Today, tomorrow & always ❤️",
        "🔥 You're the best thing that happened to me 🔥",
        "🌈 You color my world bright ✨",
        "🎁 Surprise! You're stuck with me forever 😘",
        "💋 Sending you a million kisses 💋"
      ];

      let surpriseIndex = 0;

      function showSurprise() {
        // pick a random message from the list
        const randomIdx = Math.floor(Math.random() * surpriseMessages.length);
        const msg = surpriseMessages[randomIdx];
        
        // update the dynamic message box
        dynamicMsg.innerText = msg;

        // also change the gift reveal with extra flair
        const emojis = ['🎉', '💥', '🎊', '❤️‍🔥', '✨', '💘', '🎁', '🥳', '💞', '🌟'];
        const randomEmoji1 = emojis[Math.floor(Math.random() * emojis.length)];
        const randomEmoji2 = emojis[Math.floor(Math.random() * emojis.length)];
        const randomEmoji3 = emojis[Math.floor(Math.random() * emojis.length)];
        
        giftReveal.innerHTML = `<i>${randomEmoji1} ${msg} ${randomEmoji2}  •  you're my #1  ${randomEmoji3}</i>`;
        
        // bonus: small animation on the card
        const card = document.getElementById('surpriseCard');
        card.style.transition = '0.15s';
        card.style.transform = 'scale(1.02)';
        setTimeout(() => {
          card.style.transform = 'scale(1)';
        }, 200);

        // update the button text for fun
        const btn = document.getElementById('surpriseBtn');
        const btnTexts = ['✨ AGAIN! ✨', '💕 MORE LOVE 💕', '🎈 DO IT AGAIN 🎈', '😍 ONE MORE 😍', '💥 PUSH ME 💥'];
        const randomBtn = btnTexts[Math.floor(Math.random() * btnTexts.length)];
        btn.innerText = randomBtn;

        // extra: change background of the badge
        const badge = document.querySelector('.badge');
        const colors = ['#ff477e', '#b33b6e', '#d44a7a', '#ff6b8a', '#a63d5c'];
        badge.style.background = colors[Math.floor(Math.random() * colors.length)];
      }

      // event listener
      surpriseBtn.addEventListener('click', showSurprise);

      // also trigger a small surprise on load (after 1.5 sec)
      setTimeout(() => {
        // set initial dynamic message
        dynamicMsg.innerText = "💝 You are my favorite surprise! 💝";
        giftReveal.innerHTML = `<i>💥 ready for a surprise? click the button! 💥</i>`;
      }, 300);

      // optional: click on the card itself (but not button) for extra love
      document.getElementById('surpriseCard').addEventListener('click', function(e) {
        // avoid triggering if click is on button
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        // just a tiny heart reaction
        dynamicMsg.innerText = "❤️‍🔥 I chose you! ❤️‍🔥";
        giftReveal.innerHTML = `<i>💞 every day with you is a surprise 💞</i>`;
      });

      // stop interval if page is hidden? not necessary but clean.
      window.addEventListener('beforeunload', function() {
        clearInterval(timerInterval);
      });

    })();
  </script>
</body>
</html>
